name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 libdbus-1-3 libmagic1 libpango-1.0-0 libpangoft2-1.0-0 nmap
      - name: Locked dependencies
        run: |
          python -m pip install uv==0.12.24
          python -m uv sync --locked --python ${{ matrix.python }} --extra dev --extra build
      - name: Formatting
        run: python -m uv run --no-sync black --check backend frontend shared toolkit tests scripts
      - name: Lint
        run: python -m uv run --no-sync ruff check backend frontend shared toolkit tests scripts
      - name: Strict types
        run: python -m uv run --no-sync mypy backend frontend shared toolkit
      - name: Vault KDF benchmark
        run: python -m uv run --no-sync python scripts/benchmark_vault.py vault-benchmark.json
      - name: Independent capture-worker test environment
        shell: bash
        run: |
          python -m venv .worker
          if [ "$RUNNER_OS" = Windows ]; then
            WORKER="$PWD/.worker/Scripts/python.exe"
          else
            WORKER="$PWD/.worker/bin/python"
          fi
          "$WORKER" -m pip install ./worker
          NATIVE_WORKER=$("$WORKER" -c "import sys; print(sys.executable)")
          echo "TOOLKIT_TEST_WORKER=$NATIVE_WORKER" >> "$GITHUB_ENV"
      - name: Regression and coverage
        run: python -m uv run --no-sync pytest --cov --cov-report=xml --cov-report=term -v
      - name: Fresh profile startup
        run: python -m uv run --no-sync python -m toolkit --self-test
      - name: Archive coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: |
            coverage.xml
            vault-benchmark.json

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Native libraries for shared desktop test fixture
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon0 libdbus-1-3
      - name: Install locked audit environment
        run: |
          python -m pip install uv==0.12.24
          python -m uv sync --locked --extra dev --extra build --group security
      - name: Strict vulnerability audit
        run: python -m uv run --no-sync python scripts/audit_dependencies.py
      - name: Supply-chain policy tests
        run: python -m uv run --no-sync pytest tests/test_supply_chain.py -q
      - name: Verify hashed provisioning installs
        run: |
          python scripts/build_worker_wheel.py
          python -m venv work/provision-worker
          (cd worker && ../work/provision-worker/bin/python -m pip install --require-hashes -r requirements-provision.txt)
          python -m venv work/provision-pty
          work/provision-pty/bin/python -m pip install --require-hashes -r scripts/requirements/pty.txt
          work/provision-worker/bin/python -m toolkit_scapy_worker --help
      - name: Archive findings and explicit no-fix exceptions
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dependency-audit
          path: work/dependency-audit/

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Scan every reachable commit and ref
        run: python scripts/install_gitleaks.py --scan-history

  codeql:
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:python

  container-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build digest-pinned test image
        run: docker build --tag toolkit-tests .
      - name: Verify non-root test environment
        run: |
          test "$(docker run --rm --entrypoint id toolkit-tests -u)" = 10001
          docker run --rm --init toolkit-tests
