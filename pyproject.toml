[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersecurity-fundamentals-toolkit"
version = "2.0.0"
description = "Local desktop cybersecurity fundamentals toolkit"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
  "PyQt6==6.11.0",
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "websockets==17.2",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy[asyncio]==2.1.3",
  "aiosqlite==0.22.1",
  "alembic==1.20.0",
  "cryptography==50.0.2",
  "keyring==25.7.0",
  "pymetasploit3==1.0.6",
  "pexpect==4.9.0; sys_platform != 'win32'",
  "ptyprocess==0.7.0; sys_platform != 'win32'",
  "jinja2==3.1.6",
  "darkdetect==0.8.0",
  "python-multipart==0.0.32",
  "python-nmap==0.7.1",
  "psutil==7.2.2",
  "python-magic==0.4.27",
  "zxcvbn==4.5.0",
  "urllib3==2.8.0",
  "beautifulsoup4==4.15.0",
  "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
pdf = ["weasyprint==70.0"]
build = ["PyInstaller==6.22.3"]
dev = [
  "pytest==9.1.1", "pytest-asyncio==1.4.0", "pytest-cov==7.1.0",
  "black==26.10.0", "ruff==0.16.10", "mypy==2.4.0",
]

[tool.setuptools.packages.find]
include = ["backend*", "frontend*", "shared*", "toolkit*"]

[tool.setuptools.package-data]
frontend = ["resources/themes/*.qss", "resources/icons/*", "resources/examples/*"]
"toolkit.resources" = ["*.txt"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "darkdetect"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: tests requiring local services or external tools"]

[tool.coverage.run]
source = ["backend", "frontend", "shared", "toolkit"]

[tool.coverage.report]
fail_under = 75
show_missing = true

[dependency-groups]
security = [
    "cyclonedx-bom==7.5.0",
    "pip-audit==2.10.1",
    "pre-commit==4.6.2",
]
