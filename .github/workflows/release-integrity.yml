name: Release integrity
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to sign and inventory
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-integrity-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  sign-and-inventory:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false
      - name: Resolve immutable release source
        id: release
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq 'select(.isDraft == false)' | grep -q false
          echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.release.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Locked release tooling
        working-directory: tooling
        run: |
          python -m pip install uv==0.12.24
          python -m uv sync --locked --only-group security
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Download, verify, and inventory release
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.sha }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts
          cd tooling
          python -m uv run --no-sync python scripts/release_supply_chain.py --source ../source --assets ../artifacts --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
      - name: Sign and verify every artifact and checksum manifest
        shell: bash
        run: |
          while IFS= read -r name; do
            cosign sign-blob --yes --bundle "artifacts/$name.sigstore.json" "artifacts/$name"
            cosign verify-blob --bundle "artifacts/$name.sigstore.json" --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF" --certificate-oidc-issuer https://token.actions.githubusercontent.com "artifacts/$name"
          done < artifacts/signing-list.txt
      - name: Publish signatures, SBOMs, inventories, and updated manifest
        shell: bash
        run: |
          while IFS= read -r name; do
            gh release upload "$RELEASE_TAG" "artifacts/$name" --repo "$GITHUB_REPOSITORY" --clobber
          done < artifacts/upload-list.txt
