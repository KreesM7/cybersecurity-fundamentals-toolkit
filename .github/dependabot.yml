version: 2
updates:
  - package-ecosystem: pip
    directories: ["/", "/worker", "/scripts/requirements"]
    # The local worker wheel is built in CI, not committed to Git.
    exclude-paths: ["requirements-provision.txt", "**/requirements-provision.txt"]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 10
