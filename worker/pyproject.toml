[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "toolkit-scapy-worker"
version = "1.0.0"
description = "Independent saved-capture JSONL decoder"
requires-python = ">=3.11,<3.13"
license = "MIT"
readme = "README.md"
dependencies = ["scapy==2.8.0"]

[project.scripts]
toolkit-scapy-worker = "toolkit_scapy_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]

[tool.mypy]
strict = true
python_version = "3.11"
[[tool.mypy.overrides]]
module = "scapy.*"
ignore_missing_imports = true
