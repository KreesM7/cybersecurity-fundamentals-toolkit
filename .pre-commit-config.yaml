minimum_pre_commit_version: '4.6.2'
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/psf/black
    rev: 4f1883b1f15305a0e83a7c87991f46292bf09f85 # 26.10.0
    hooks:
      - id: black
        files: ^(backend|frontend|shared|toolkit|tests|scripts)/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253 # v0.16.10
    hooks:
      - id: ruff-check
        files: ^(backend|frontend|shared|toolkit|tests|scripts)/
  - repo: local
    hooks:
      - id: gitleaks
        name: Gitleaks staged secrets
        language: python
        entry: python scripts/install_gitleaks.py --scan-staged
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: gitleaks-history
        name: Gitleaks full history
        language: python
        entry: python scripts/install_gitleaks.py --scan-history
        pass_filenames: false
        always_run: true
        stages: [pre-push]
